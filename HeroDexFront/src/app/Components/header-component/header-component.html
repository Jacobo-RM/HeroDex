<header class="main">
  <div class="bar">

    <a class="brand" routerLink="/characters" aria-label="HeroDex, ir al inicio">
      <span class="brand-mark">H</span>
      <span class="brand-name">Hero<b>Dex</b></span>
    </a>

    <nav class="links" aria-label="Navegación principal">
      <a [routerLink]="['/characters']"
         routerLinkActive="active"
         ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{ exact: true }">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span>Characters</span>
      </a>

      <a [routerLink]="['/characters/Herodle']"
         routerLinkActive="active"
         ariaCurrentWhenActive="page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="12" cy="12" r="0.8" />
        </svg>
        <span>Herodle</span>
        <span class="badge">Diario</span>
      </a>
    </nav>

  </div>
</header>
